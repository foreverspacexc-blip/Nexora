<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXORA</title>
    <link rel="stylesheet" href="style.css">

    <!-- Supabase SDK (v2) สำหรับเบราว์เซอร์ -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <!-- ================= หน้าแรก: ระบบปลดล็อก ================= -->
    <div id="unlock-screen" class="screen active">
        <div class="card">
            <h2>ขั้นตอนการเข้าสู่เว็บไซต์</h2>
            <p id="status-text">กรุณากดปุ่มด้านล่างเพื่อเปิดลิงก์และเริ่มนับเวลา</p>

            <button id="btn-open-tab" class="btn btn-blue">1. เปิดลิงก์ภายนอก</button>
            <button id="btn-unlock" class="btn btn-gray" disabled>2. ปลดล็อก (รอระบบ)</button>
        </div>
    </div>

    <!-- ================= หน้าหลัก: แสดงข้อมูล Box และ Admin ================= -->
    <div id="main-screen" class="screen">
        <header>
            <h1>หน้าเว็บหลัก</h1>
            <div>
                <button id="btn-admin-panel" class="btn btn-sm btn-gray" style="display:none;">จัดการระบบ</button>
                <button id="btn-show-login" class="btn btn-sm btn-blue">Admin Login</button>
                <button id="btn-logout" class="btn btn-sm btn-red" style="display:none;">Logout</button>
            </div>
        </header>

        <!-- โซนฟอร์มสำหรับ Admin -->
        <div id="admin-form-container" class="admin-zone" style="display: none;">
            <h3>เพิ่มกล่องวิดีโอใหม่ (Admin Only)</h3>
            <div class="form-group">
                <input type="text" id="input-name" placeholder="ชื่อคลิป / หัวข้อ">
                <input type="text" id="input-creator" placeholder="ชื่อผู้สร้าง Box">
                <input type="text" id="input-yt-link" placeholder="ลิงก์ YouTube (เช่น https://www.youtube.com/watch?v=xxxxxxxxxxx)">
                <button id="btn-add-box" class="btn btn-green">สร้าง Box และเซฟลง Cloud</button>
            </div>
        </div>

        <!-- รายการ Box จาก Supabase -->
        <main id="box-container" class="grid-container"></main>
    </div>

    <!-- Pop-up Login Admin -->
    <div id="login-modal" class="modal">
        <div class="modal-content">
            <h3>ผู้ดูแลระบบเข้าสู่ระบบ</h3>
            <input type="text" id="login-user" placeholder="Username" autocomplete="username">
            <input type="password" id="login-pass" placeholder="Password" autocomplete="current-password">
            <div class="modal-actions">
                <button id="btn-submit-login" class="btn btn-green">ตกลง</button>
                <button id="btn-close-login" class="btn btn-gray">ยกเลิก</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
